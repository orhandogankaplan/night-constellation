<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Night Constellation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="ambient-backdrop" class="ambient-backdrop"></div>
  <canvas id="bg-canvas"></canvas>
  <canvas id="constellation-canvas"></canvas>

  <div class="edge-aura" id="edge-aura"></div>

  <header class="clock-header">
    <div id="greeting-label" class="greeting-label">İyi geceler</div>
    <div id="date-label" class="date-label">Fri 13 Nov</div>
    <div id="time-label" class="time-label style-macbook">00:52</div>
    <div class="clock-sub-pills">
      <div id="weather-badge" class="sub-pill hidden"></div>
      <button id="pomodoro-pill" class="sub-pill clickable hidden" title="Başlat/Duraklat (Çift tık: Sıfırla)">🍅 25:00</button>
    </div>
  </header>

  <main class="idle-stage" id="idle-stage">
    <div class="cover-flow-stage" id="cover-flow-stage">
      <button class="side-cover prev hidden" id="cover-prev" title="Önceki Şarkı">
        <img id="prev-album-art" alt="Previous" class="hidden" />
        <div id="prev-album-fallback" class="side-fallback">⏮</div>
        <div class="side-label" id="prev-track-label">Önceki</div>
      </button>

      <div class="radial-wrap" id="radial-wrap">
        <canvas id="radial-canvas" width="340" height="340"></canvas>
        <div class="center-art-ring" id="center-art-ring">
          <img id="center-album-art" alt="Album Cover" class="hidden" />
          <div id="center-album-fallback" class="center-album-fallback">♪</div>
        </div>
      </div>

      <button class="side-cover next hidden" id="cover-next" title="Sonraki Şarkı">
        <img id="next-album-art" alt="Next" class="hidden" />
        <div id="next-album-fallback" class="side-fallback">⏭</div>
        <div class="side-label" id="next-track-label">Sonraki</div>
      </button>
    </div>

    <div class="media-pill hidden" id="media-pill">
      <div class="album-wrap">
        <img id="album-art" alt="Album Art" class="hidden" />
        <div id="album-fallback" class="album-fallback">♪</div>
      </div>
      <div class="track-meta">
        <div class="track-title-row">
          <div id="track-title" class="track-title">Not Playing</div>
          <div id="live-bars" class="live-bars paused">
            <span></span><span></span><span></span>
          </div>
        </div>
        <div id="track-artist" class="track-artist">Play music to start</div>
        <div class="progress-row">
          <span id="time-elapsed" class="time-mini">0:00</span>
          <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <span id="time-total" class="time-mini">0:00</span>
        </div>
      </div>
      <div class="media-controls">
        <button id="btn-prev" class="ctrl-btn" title="Previous" aria-label="Previous">&#9198;</button>
        <button id="btn-play" class="ctrl-btn primary" title="Play / Pause" aria-label="Play or Pause">&#9654;</button>
        <button id="btn-next" class="ctrl-btn" title="Next" aria-label="Next">&#9197;</button>
      </div>
    </div>
  </main>

  <aside class="hud-telemetry" id="hud-telemetry">
    <div class="hud-row">
      <span class="hud-dot" id="hud-beat-dot"></span>
      <span id="hud-bpm">-- BPM</span>
      <span class="hud-sep">|</span>
      <span id="hud-cpu">CPU --%</span>
      <span class="hud-sep">|</span>
      <span id="hud-ram">RAM --%</span>
      <span id="hud-bat-wrap" class="hidden"><span class="hud-sep"> | </span><span id="hud-bat"></span></span>
    </div>
    <canvas id="hud-scope" width="196" height="26"></canvas>
  </aside>

  <section class="settings-panel hidden" id="settings-panel">
    <div class="settings-header">
      <span>Night Constellation Ayarlar</span>
      <button id="btn-close-settings" class="settings-close">✕</button>
    </div>
    <div id="stats-banner" class="stats-banner">Dinlenen: 0 şarkı · En çok: -</div>
    <label class="setting-item">
      <span>Saat Stili</span>
      <select id="set-clock-style">
        <option value="macbook">MacBook Kalın & Uzun</option>
        <option value="serif">Klasik Serif</option>
        <option value="neon">Dijital Neon</option>
      </select>
    </label>
    <label class="setting-item">
      <span>Saat Boyutu</span>
      <input type="range" id="set-clock-size" min="54" max="124" step="2" value="88" />
    </label>
    <label class="setting-item">
      <span>Tema</span>
      <select id="set-theme">
        <option value="adaptive">Otomatik (Albüm)</option>
        <option value="champagne">Klasik Şampanya</option>
        <option value="cyber_ice">Buz Mavisi</option>
        <option value="crimson_night">Kızıl Gece</option>
      </select>
    </label>
    <label class="setting-item">
      <span>Parçacık Modu</span>
      <select id="set-particle-mode">
        <option value="stars">Yıldız Alanı</option>
        <option value="snow">Yavaş Kar Yağışı</option>
        <option value="matrix">Dijital Yağmur (Matrix)</option>
      </select>
    </label>
    <label class="setting-item">
      <span>Kenar Parlaklığı</span>
      <input type="range" id="set-glow" min="0.2" max="1.6" step="0.1" value="1.0" />
    </label>
    <label class="setting-item">
      <span>Kişisel Motto (Boş = Otomatik Selam)</span>
      <input type="text" id="set-motto" placeholder="Örn: Odaklanma zamanı..." maxlength="48" />
    </label>
    <label class="setting-toggle"><input type="checkbox" id="set-vinyl" checked /><span>Plak (Vinyl) Dönüşü</span></label>
    <label class="setting-toggle"><input type="checkbox" id="set-ambient" checked /><span>Albüm Ambient Arka Plan</span></label>
    <label class="setting-toggle"><input type="checkbox" id="set-orbital" checked /><span>3D Yörünge Halkaları</span></label>
    <label class="setting-toggle"><input type="checkbox" id="set-aurora" checked /><span>Aurora Kuzey Işıkları</span></label>
    <label class="setting-toggle"><input type="checkbox" id="set-equalizer" checked /><span>Alt Cam Ekolayzır</span></label>
    <label class="setting-toggle"><input type="checkbox" id="set-weather" checked /><span>Hava Durumu Rozeti</span></label>
    <label class="setting-toggle"><input type="checkbox" id="set-pomodoro" /><span>Odak / Pomodoro (P)</span></label>
    <label class="setting-toggle"><input type="checkbox" id="set-nebula" checked /><span>3D Galaksi (Nebula)</span></label>
    <label class="setting-toggle"><input type="checkbox" id="set-magnetic" checked /><span>Manyetik Parçacık Fiziği</span></label>
    <label class="setting-toggle"><input type="checkbox" id="set-hud" checked /><span>HUD Telemetri</span></label>
    <label class="setting-toggle"><input type="checkbox" id="set-translate" checked /><span>Türkçe Söz Çevirisi</span></label>
    <label class="setting-toggle"><input type="checkbox" id="set-amber" /><span>Gece Kehribar Göz Koruma</span></label>
    <label class="setting-toggle"><input type="checkbox" id="set-eco" checked /><span>Auto-Eco (Tam Ekran Oyun Modu)</span></label>
  </section>

  <div class="desktop-hud" id="desktop-hud">
    <button id="btn-settings" class="hud-chip" title="Ayarlar (S)">Ayarlar</button>
    <button id="btn-demo" class="hud-chip" title="Toggle Demo Mode (D)">Demo: Off</button>
    <button id="btn-exit" class="hud-chip" title="Exit (Esc)">Exit</button>
  </div>

  <script src="constellation.js"></script>
  <script src="app.js"></script>
</body>
</html>
